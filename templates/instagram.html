<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram - Masuk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center}
.demo-banner{background:#dc2626;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:bold;position:fixed;top:0;left:0;right:0;z-index:999}
.card{background:#1b1b1b;width:380px;padding:40px;border:1px solid #363636;border-radius:12px;margin-top:40px;text-align:center}
.logo{font-family:cursive;font-size:32px;color:#fff;margin-bottom:30px;font-weight:600}
.form-group{margin-bottom:12px}
.form-group input{width:100%;padding:12px;background:#121212;border:1px solid #363636;border-radius:6px;font-size:14px;color:#fff}
.form-group input::placeholder{color:#8e8e8e}
.form-group input:focus{outline:none;border-color:#8e8e8e}
.btn{width:100%;padding:10px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:14px}
.btn:hover{background:#1877f2}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:#737373;font-size:13px}
.or hr{flex:1;border:none;border-top:1px solid #363636}
.fb-login{color:#0095f6;font-size:14px;font-weight:500;text-decoration:none;display:block;margin:10px 0}
.forgot{color:#e0f1ff;font-size:12px;text-decoration:none;display:block;margin-top:14px}
.signup{border-top:1px solid #363636;margin-top:20px;padding-top:20px;font-size:14px;color:#737373}
.signup a{color:#0095f6;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="demo-banner">🔬 DEMO EDUKASI — Cybersecurity Seminar | JANGAN MASUKKAN PASSWORD ASLI</div>
<div class="card">
<div class="logo">Instagram</div>
<form action="/capture" method="POST">
<input type="hidden" name="template" value="instagram">
<div class="form-group">
<input type="text" name="username" placeholder="Nomor telepon, nama pengguna, atau email" required>
</div>
<div class="form-group">
<input type="password" name="password" placeholder="Kata sandi" required>
</div>
<button type="submit" class="btn">Masuk</button>
</form>
<div class="or"><hr><span>ATAU</span><hr></div>
<a href="#" class="fb-login">Masuk dengan Facebook</a>
<a href="#" class="forgot">Lupa kata sandi?</a>
</div>
<div class="signup">Tidak punya akun? <a href="#">Daftar</a></div>
<div style="position:fixed;bottom:5px;right:10px;font-size:10px;color:rgba(220,38,38,0.3);font-weight:bold">🔬 DEMO EDUKASI</div>
</body>
</html>
